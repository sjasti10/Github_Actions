name: Add Prefix

on:
  push:
    branches: [ master ]
permissions:
  contents: write

jobs:
  rename-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add AddandUpdate prefix
        run: |
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != AddandUpdate_* ]]; then
              mv "$file" "AddandUpdate_$file"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Add AddandUpdate prefix" || exit 0
          git push
